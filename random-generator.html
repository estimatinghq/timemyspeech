<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Tools | Time My Speech</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f4f7fc,#f8fbff);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:900px;
background:white;
border-radius:24px;
padding:28px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

h1{
text-align:center;
margin-bottom:20px;
}

.home-button{
position:absolute;
top:20px;
right:40px;
padding:8px 16px;
background:#f3f4f6;
border:1px solid #d1d5db;
border-radius:10px;
text-decoration:none;
font-size:14px;
color:#111827;
font-weight:500;
}

.tabs{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:20px;
}

.tab{
padding:10px 16px;
border-radius:20px;
border:1px solid #d1d5db;
background:white;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#2563eb;
color:white;
}

.panel{display:none;}
.panel.active{display:block;}

button{
padding:12px 16px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

.result{
margin-top:20px;
padding:20px;
border:1px solid #ddd;
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:bold;
}

/* COIN */

.coin{
width:120px;
height:120px;
border-radius:50%;
background:linear-gradient(145deg,#f6c453,#d4a017);
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
font-weight:bold;
margin:20px auto;
color:white;
transform-style:preserve-3d;
}

.spin{
animation:spinCoin 1.5s ease-out;
}

@keyframes spinCoin{
0%{transform:rotateY(0deg);}
100%{transform:rotateY(1440deg);}
}

</style>
</head>

<body>

<a href="https://timemyspeech.com/" class="home-button">Home</a>

<div class="container">

<h1>Generator Tools</h1>

<div class="tabs">
<div class="tab active" onclick="showTab('password',this)">Password</div>
<div class="tab" onclick="showTab('number',this)">Random Number</div>
<div class="tab" onclick="showTab('coin',this)">Coin Flip</div>
</div>

<!-- PASSWORD -->

<div class="panel active" id="password">

<label>Password Length</label>
<input type="number" id="passLength" value="12" min="4" max="50">

<br><br>

<button onclick="generatePassword()">Generate Password</button>

<div class="result" id="passwordResult"></div>

</div>

<!-- RANDOM NUMBER -->

<div class="panel" id="number">

<label>Min</label>
<input type="number" id="minNum" value="1">

<label>Max</label>
<input type="number" id="maxNum" value="100">

<br><br>

<button onclick="generateNumber()">Generate</button>

<div class="result" id="numberResult"></div>

</div>

<!-- COIN -->

<div class="panel" id="coin">

<div class="coin" id="coinFace">?</div>

<button onclick="flipCoin()">Flip Coin</button>

<div class="result" id="coinResult"></div>

</div>

</div>

<script>

/* TAB SWITCH */

function showTab(id,btn){

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

document.getElementById(id).classList.add("active");
btn.classList.add("active");

}

/* PASSWORD */

function generatePassword(){

let length=document.getElementById("passLength").value;

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

let password="";

for(let i=0;i<length;i++){

password+=chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("passwordResult").innerText=password;

}

/* RANDOM NUMBER */

function generateNumber(){

let min=parseInt(document.getElementById("minNum").value);
let max=parseInt(document.getElementById("maxNum").value);

let num=Math.floor(Math.random()*(max-min+1))+min;

document.getElementById("numberResult").innerText=num;

}

/* COIN */

function flipCoin(){

let coin=document.getElementById("coinFace");

coin.classList.remove("spin");

void coin.offsetWidth;

coin.classList.add("spin");

let result=Math.random()<0.5?"Heads":"Tails";

setTimeout(()=>{

coin.innerText=result==="Heads"?"H":"T";

document.getElementById("coinResult").innerText=result;

},1500);

}

</script>

</body>
</html>
