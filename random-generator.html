<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Tools | Time My Speech</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f4f7fc,#f8fbff);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px;
}

.home-button{
position:absolute;
top:20px;
right:40px;
padding:8px 16px;
background:#f3f4f6;
border:1px solid #d1d5db;
border-radius:10px;
text-decoration:none;
font-size:14px;
color:#111827;
font-weight:500;
}

.container{
width:100%;
max-width:900px;
background:white;
border-radius:24px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.logo{
text-align:center;
font-weight:bold;
color:#2563eb;
margin-bottom:10px;
}

h1{
text-align:center;
margin-top:0;
}

.subtext{
text-align:center;
color:#6b7280;
margin-bottom:25px;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:25px;
}

.tab{
padding:10px 18px;
border:1px solid #d1d5db;
border-radius:20px;
cursor:pointer;
font-weight:600;
background:white;
}

.tab.active{
background:#2563eb;
color:white;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

input{
padding:10px;
border:1px solid #d1d5db;
border-radius:8px;
margin:5px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

button.secondary{
background:#f3f4f6;
color:#111827;
border:1px solid #d1d5db;
}

.result{
margin-top:20px;
padding:20px;
border:1px solid #e5e7eb;
border-radius:12px;
font-size:22px;
font-weight:bold;
text-align:center;
min-height:60px;
}

.combo{
margin-top:10px;
text-align:center;
color:#6b7280;
font-size:14px;
}

.coin-wrap{
display:flex;
justify-content:center;
margin-top:10px;
}

.coin{
width:120px;
height:120px;
border-radius:50%;
background:linear-gradient(145deg,#f6c453,#d4a017);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
color:white;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.coin.spin{
animation:coinFlip 1.5s ease-out;
}

@keyframes coinFlip{

0%{transform:rotateY(0deg);}

100%{transform:rotateY(1440deg);}

}

.controls{
text-align:center;
}

</style>

</head>

<body>

<a href="https://timemyspeech.com/" class="home-button">Home</a>

<div class="container">

<div class="logo">Time My Speech</div>

<h1>Generator Tools</h1>

<p class="subtext">
Generate passwords, random numbers, and flip a coin instantly.
</p>

<div class="tabs">

<div class="tab active" onclick="showTab('password',this)">Password Generator</div>

<div class="tab" onclick="showTab('number',this)">Random Number</div>

<div class="tab" onclick="showTab('coin',this)">Coin Flip</div>

</div>

<!-- PASSWORD -->

<div class="panel active" id="password">

<div class="controls">

<label>Password Length</label><br>

<input type="number" id="passLength" value="12" min="4" max="50">

<br><br>

<button onclick="generatePassword()">Generate Password</button>

<button class="secondary" onclick="copyText('passwordResult',this)">Copy</button>

</div>

<div class="result" id="passwordResult"></div>

<div class="combo" id="passwordCombos"></div>

</div>

<!-- RANDOM NUMBER -->

<div class="panel" id="number">

<div class="controls">

<label>Min</label>

<input type="number" id="minNum" value="1">

<label>Max</label>

<input type="number" id="maxNum" value="100">

<br><br>

<button onclick="generateNumber()">Generate</button>

<button class="secondary" onclick="copyText('numberResult',this)">Copy</button>

</div>

<div class="result" id="numberResult"></div>

</div>

<!-- COIN -->

<div class="panel" id="coin">

<div class="coin-wrap">

<div class="coin" id="coinFace">?</div>

</div>

<div class="controls">

<button onclick="flipCoin()">Flip Coin</button>

<button class="secondary" onclick="copyText('coinResult',this)">Copy</button>

</div>

<div class="result" id="coinResult"></div>

</div>

</div>

<script>

function showTab(id,btn){

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

document.getElementById(id).classList.add("active");

btn.classList.add("active");

}

/* PASSWORD */

function generatePassword(){

let length=parseInt(document.getElementById("passLength").value);

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

let password="";

for(let i=0;i<length;i++){

password+=chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("passwordResult").innerText=password;

let combos=Math.pow(chars.length,length);

let comboText="";

if(combos>=1e21){
comboText=(combos/1e21).toFixed(1)+" sextillion";
}else if(combos>=1e18){
comboText=(combos/1e18).toFixed(1)+" quintillion";
}else if(combos>=1e15){
comboText=(combos/1e15).toFixed(1)+" quadrillion";
}else if(combos>=1e12){
comboText=(combos/1e12).toFixed(1)+" trillion";
}else{
comboText=combos.toLocaleString();
}

document.getElementById("passwordCombos").innerText="Possible combinations: "+comboText;

}

/* RANDOM NUMBER */

function generateNumber(){

let min=parseInt(document.getElementById("minNum").value);

let max=parseInt(document.getElementById("maxNum").value);

let num=Math.floor(Math.random()*(max-min+1))+min;

document.getElementById("numberResult").innerText=num;

}

/* COIN */

function flipCoin(){

let coin=document.getElementById("coinFace");

coin.classList.remove("spin");

void coin.offsetWidth;

coin.classList.add("spin");

let result=Math.random()<0.5?"Heads":"Tails";

setTimeout(()=>{

coin.innerText=result==="Heads"?"H":"T";

document.getElementById("coinResult").innerText=result;

},1500);

}

/* COPY */

function copyText(id,btn){

let text=document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

btn.innerText="Copied";

setTimeout(()=>{

btn.innerText="Copy";

},1500);

}

</script>

</body>

</html>
