<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Debate Topic Generator | Time My Speech</title>

<meta name="description" content="Generate random debate topics for school, speeches, class activities and public speaking practice." />

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom right,#f8fafc,#e2e8f0);
color:#111827;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.home-button{
position:absolute;
top:20px;
right:580px;
padding:8px 16px;
background:#f3f4f6;
border:1px solid #d1d5db;
border-radius:10px;
text-decoration:none;
font-size:14px;
color:#111827;
font-weight:500;
}

.home-button:hover{
background:#e5e7eb;
}

.container{
width:100%;
max-width:820px;
background:white;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
padding:42px 24px;
text-align:center;
}

.logo{
font-size:14px;
font-weight:700;
color:#2563eb;
margin-bottom:14px;
letter-spacing:0.5px;
text-transform:uppercase;
}

h1{
margin:0 0 10px;
font-size:40px;
line-height:1.15;
}

.subtext{
margin:0 auto 28px;
max-width:600px;
font-size:17px;
color:#4b5563;
line-height:1.5;
}

.machine-wrap{
position:relative;
margin-bottom:24px;
}

.machine-topbar{
display:inline-flex;
align-items:center;
gap:8px;
background:#eff6ff;
color:#1d4ed8;
border:1px solid #bfdbfe;
border-radius:999px;
padding:8px 14px;
font-size:13px;
font-weight:700;
margin-bottom:14px;
}

.topic-box{
position:relative;
background:linear-gradient(180deg,#f9fafb 0%,#f3f4f6 100%);
border:2px solid #e5e7eb;
border-radius:22px;
min-height:220px;
padding:24px 18px;
overflow:hidden;
box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);
}

.topic-window{
position:relative;
height:150px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.topic-reel{
display:flex;
flex-direction:column;
align-items:stretch;
transition:transform 0.12s linear;
will-change:transform;
}

.reel-item{
height:150px;
display:flex;
align-items:center;
justify-content:center;
padding:0 18px;
}

.reel-item span{
display:block;
font-size:30px;
font-weight:700;
line-height:1.35;
color:#111827;
max-width:680px;
}

.fade-top,
.fade-bottom{
position:absolute;
left:0;
width:100%;
height:38px;
z-index:2;
pointer-events:none;
}

.fade-top{
top:0;
background:linear-gradient(to bottom,rgba(243,244,246,1),rgba(243,244,246,0));
}

.fade-bottom{
bottom:0;
background:linear-gradient(to top,rgba(243,244,246,1),rgba(243,244,246,0));
}

.selector-line{
position:absolute;
left:14px;
right:14px;
top:50%;
transform:translateY(-50%);
height:150px;
border:2px solid rgba(37,99,235,0.16);
border-radius:18px;
pointer-events:none;
z-index:1;
box-shadow:0 0 0 6px rgba(37,99,235,0.04);
}

.buttons{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:22px;
}

button{
border:none;
border-radius:12px;
padding:14px 20px;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:0.2s ease;
}

.primary-btn{
background:#2563eb;
color:white;
min-width:150px;
}

.primary-btn:hover{
background:#1d4ed8;
}

.primary-btn:disabled{
opacity:0.7;
cursor:not-allowed;
}

.secondary-btn{
background:#f3f4f6;
color:#111827;
border:1px solid #d1d5db;
}

.secondary-btn:hover{
background:#e5e7eb;
}

.category{
margin-top:10px;
font-size:15px;
color:#6b7280;
}

.category-badge{
display:inline-block;
margin-top:8px;
background:#eef2ff;
color:#4338ca;
border:1px solid #c7d2fe;
border-radius:999px;
padding:8px 14px;
font-size:14px;
font-weight:700;
}

.footer-note{
margin-top:26px;
font-size:14px;
color:#6b7280;
}

.landed{
animation:pop 0.28s ease;
}

@keyframes pop{
0%{transform:scale(0.98);}
50%{transform:scale(1.02);}
100%{transform:scale(1);}
}

</style>
</head>

<body>

<a href="https://timemyspeech.com/" class="home-button">Home</a>

<div class="container">

<div class="logo">Time My Speech</div>

<h1>Debate Topic Generator</h1>

<p class="subtext">
Spin to generate a random debate topic for school, speeches, class practice and public speaking.
</p>

<div class="machine-wrap">

<div class="machine-topbar">
Interactive topic spinner
</div>

<div class="topic-box" id="topicBox">

<div class="fade-top"></div>
<div class="fade-bottom"></div>
<div class="selector-line"></div>

<div class="topic-window">
<div class="topic-reel" id="topicReel"></div>
</div>

</div>
</div>

<div class="buttons">
<button class="primary-btn" id="spinBtn" onclick="spinTopic()">Spin Again</button>
<button class="secondary-btn" id="copyBtn" onclick="copyTopic()">Copy Topic</button>
</div>

<div class="category" id="categoryText">Category</div>
<div class="category-badge" id="categoryBadge">Ready</div>

<div class="footer-note">
Great for students, teachers and speech practice.
</div>

</div>

<script>

const debateTopics=[
{topic:"Schools should ban homework.",category:"School"},
{topic:"School uniforms should be optional.",category:"School"},
{topic:"Students should be allowed to use phones in class.",category:"School"},
{topic:"Exams are not the best way to measure intelligence.",category:"Education"},
{topic:"Students should learn finance instead of some traditional subjects.",category:"Education"},
{topic:"Artificial intelligence will do more good than harm.",category:"Technology"},
{topic:"Social media should have stricter age limits.",category:"Technology"},
{topic:"Online learning is better than classroom learning.",category:"Education"},
{topic:"Video games can be good for young people.",category:"Lifestyle"},
{topic:"Children under 16 should not use social media.",category:"Technology"},
{topic:"Homework should be banned on weekends.",category:"School"},
{topic:"Zoos should be banned.",category:"Environment"},
{topic:"Fast food advertising to children should be banned.",category:"Health"},
{topic:"Every student should do public speaking at school.",category:"School"},
{topic:"School days should start later.",category:"School"},
{topic:"Books are better than movies.",category:"Fun"},
{topic:"Space exploration is worth the money.",category:"Science"},
{topic:"The voting age should be lowered to 16.",category:"Society"},
{topic:"Celebrities are paid too much.",category:"Society"},
{topic:"Animals should not be used for entertainment.",category:"Ethics"},
{topic:"Recycling should be compulsory.",category:"Environment"},
{topic:"School lunches should be free for all students.",category:"School"},
{topic:"Uniforms improve student behaviour.",category:"School"},
{topic:"Kids should have less screen time.",category:"Health"},
{topic:"Influencers are bad role models.",category:"Society"},
{topic:"Homework does more harm than good.",category:"Education"}
];

const reel=document.getElementById("topicReel");
const spinBtn=document.getElementById("spinBtn");
const copyBtn=document.getElementById("copyBtn");
const topicBox=document.getElementById("topicBox");
const categoryText=document.getElementById("categoryText");
const categoryBadge=document.getElementById("categoryBadge");

let currentTopic="";
let currentCategory="Ready";
let spinning=false;

function buildInitialReel(){
reel.innerHTML="";
const first=debateTopics[0];
const item=document.createElement("div");
item.className="reel-item";
item.innerHTML=`<span>${first.topic}</span>`;
reel.appendChild(item);
currentTopic=first.topic;
currentCategory=first.category;
}

function spinTopic(){

if(spinning) return;

spinning=true;
spinBtn.disabled=true;
spinBtn.textContent="Spinning...";
topicBox.classList.remove("landed");

let spins=0;
const maxSpins=18;

const spinInterval=setInterval(()=>{

const random=debateTopics[Math.floor(Math.random()*debateTopics.length)];

reel.innerHTML=`<div class="reel-item"><span>${random.topic}</span></div>`;

spins++;

if(spins>=maxSpins){

clearInterval(spinInterval);

currentTopic=random.topic;
currentCategory=random.category;

categoryText.textContent="Category";
categoryBadge.textContent=currentCategory;

topicBox.classList.add("landed");

spinBtn.disabled=false;
spinBtn.textContent="Spin Topic";
spinning=false;

}

},90);

}

function copyTopic(){

if(!currentTopic || spinning) return;

navigator.clipboard.writeText(currentTopic);

copyBtn.textContent="Copied";
copyBtn.style.background="#22c55e";
copyBtn.style.color="white";

setTimeout(()=>{
copyBtn.textContent="Copy Topic";
copyBtn.style.background="#f3f4f6";
copyBtn.style.color="#111827";
},1500);

}

buildInitialReel();

</script>

</body>
</html>
