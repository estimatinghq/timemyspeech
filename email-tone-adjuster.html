<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix My Email Tone | TimeMySpeech</title>
<style>

body{
  margin:0;
  font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container{
  width:95%;
  max-width:1200px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.panel{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

h2{
  margin:0;
  font-size:22px;
}

textarea, .output{
  flex:1;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  font-size:15px;
  line-height:1.6;
  resize:none;
}

.output{
  background:#f9fafb;
}

.tones{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tone{
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  cursor:pointer;
}

.tone:hover{
  background:#eef2ff;
}

.buttons{
  margin-top:14px;
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px 14px;
  font-size:14px;
  cursor:pointer;
}

.primary{
  background:#4f46e5;
  color:white;
}

.secondary{
  background:#f3f4f6;
}

.copy{
  background:#10b981;
  color:white;
}

@media(max-width:900px){
  body{height:auto;padding:20px 0}
  .container{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div class="container">

<div class="panel">

<div class="panel-header">
<h2>Your message</h2>
<span style="font-size:13px;color:#6b7280">Paste email or text</span>
</div>

<textarea placeholder="Paste your message here">Hi Fiona, just checking if you can send the contract today.</textarea>

<div class="tones">
<div class="tone">🙏 More polite</div>
<div class="tone">💼 Professional</div>
<div class="tone">⚡ More direct</div>
<div class="tone">🧱 More firm</div>
<div class="tone">😊 Friendlier</div>
<div class="tone">✂️ Shorter</div>
<div class="tone">🔥 Stronger</div>
<div class="tone">🕊️ Softer</div>
</div>

<div class="buttons">
<button class="primary">Adjust tone</button>
<button class="secondary">Clear</button>
</div>

</div>

<div class="panel">

<div class="panel-header">
<h2>Adjusted version</h2>
<button class="copy">Copy</button>
</div>

<div class="output">
Hi Fiona, just checking in to see whether you might be able to send the contract through today when convenient. Thank you.
</div>

</div>

</div>

</body>
</html>
