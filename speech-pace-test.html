<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speech Pace Test | Time My Speech</title>
<meta name="description" content="Test your speaking speed and calculate your words per minute for speeches and presentations.">

<style>

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f4f7fc 0%,#f8fbff 100%);
margin:0;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
max-width:700px;
width:90%;
text-align:center;
}

h1{
font-size:36px;
margin-bottom:10px;
}

p{
color:#6b7280;
}

.sentence{
background:#f8fafc;
border:1px solid #e5e7eb;
padding:20px;
border-radius:14px;
margin:25px 0;
font-size:18px;
font-weight:600;
}

.timer{
font-size:42px;
font-weight:800;
margin:20px 0;
}

button{
padding:14px 24px;
font-size:16px;
border-radius:10px;
border:none;
cursor:pointer;
margin:5px;
font-weight:700;
}

.start{
background:#2563eb;
color:white;
}

.stop{
background:#f3f4f6;
}

.result{
margin-top:25px;
font-size:20px;
font-weight:700;
}

.top-links{
margin-bottom:20px;
}

.top-links a{
margin:0 6px;
text-decoration:none;
color:#2563eb;
font-weight:600;
}

</style>

</head>
<body>

<div class="container">

<div class="top-links">
<a href="/">Speech Timer</a> |
<a href="/speech-word-calculator.html">Speech Word Calculator</a> |
<a href="/debate-topic-generator.html">Debate Topic Generator</a>
</div>

<h1>Speech Pace Test</h1>

<p>Read the sentence aloud and stop the timer when finished.</p>

<div class="sentence" id="sentence">

Good morning everyone. Today I will explain one clear idea, give a short example, and finish with a quick summary. Thank you for listening.

</div>

<div class="timer" id="timer">0.0s</div>

<button class="start" onclick="startTest()">Start</button>
<button class="stop" onclick="stopTest()">Stop</button>

<div class="result" id="result"></div>

</div>

<script>
let startTime = null;
let timerInterval = null;
let isRunning = false;

function startTest() {
  if (isRunning) return;

  document.getElementById("result").innerHTML = "";
  startTime = Date.now();
  isRunning = true;

  timerInterval = setInterval(function () {
    let elapsed = (Date.now() - startTime) / 1000;
    document.getElementById("timer").innerHTML = elapsed.toFixed(1) + "s";
  }, 100);
}

function stopTest() {
  if (!isRunning) return;

  clearInterval(timerInterval);
  timerInterval = null;
  isRunning = false;

  let elapsed = (Date.now() - startTime) / 1000;
  let sentence = document.getElementById("sentence").innerText;
  let words = sentence.trim().split(/\s+/).length;
  let wpm = Math.round((words / elapsed) * 60);

  let message = "";

  if (wpm < 140) message = "Slow speaking pace";
  else if (wpm < 170) message = "Normal speaking pace";
  else message = "Fast speaking pace";

  document.getElementById("result").innerHTML =
    "Your speaking speed: <b>" + wpm + " WPM</b><br>" + message;
}
</script>
</body>
</html>
