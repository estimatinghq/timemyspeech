<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Word Calculator | Time My Speech</title>

<style>

*{
box-sizing:border-box;
}

:root{
--bg:#f6f8fc;
--card:#ffffff;
--border:#e5e7eb;
--text:#111827;
--muted:#6b7280;
--primary:#2563eb;
--soft-blue:#eff6ff;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f4f7fc 0%,#f8fbff 100%);
color:var(--text);

display:flex;
align-items:center;
justify-content:center;

height:100vh;
overflow:hidden;
}

.home-button{
position:absolute;
top:20px;
right:40px;
padding:8px 16px;
background:#f3f4f6;
border:1px solid #d1d5db;
border-radius:10px;
text-decoration:none;
font-size:14px;
color:#111827;
font-weight:500;
}

.home-button:hover{
background:#e5e7eb;
}

.container{
width:100%;
max-width:980px;
background:var(--card);
border:1px solid var(--border);
border-radius:26px;
box-shadow:0 18px 50px rgba(15,23,42,0.06);
overflow:hidden;
}

.inner{
padding:26px;
}

.hero{
text-align:center;
margin-bottom:24px;
}

.logo{
display:inline-block;
margin-bottom:12px;
padding:8px 14px;
font-size:13px;
font-weight:700;
color:var(--primary);
background:var(--soft-blue);
border:1px solid #bfdbfe;
border-radius:999px;
text-transform:uppercase;
letter-spacing:0.4px;
}

h1{
margin:0 0 10px;
font-size:40px;
line-height:1.1;
letter-spacing:-1px;
}

.subtext{
margin:0 auto;
max-width:700px;
font-size:16px;
line-height:1.6;
color:var(--muted);
}

</style>
</head>

<body>

<a href="https://timemyspeech.com/" class="home-button">Home</a>

<div class="container">
<div class="inner">

<div class="hero">

<div class="logo">
Time My Speech
</div>

<h1>Speech Word Calculator</h1>

<p class="subtext">
Find out how many words you need for a speech based on your speaking speed.
</p>

</div>

<!-- your existing calculator content stays here -->

</div>
</div>

</body>
</html>
